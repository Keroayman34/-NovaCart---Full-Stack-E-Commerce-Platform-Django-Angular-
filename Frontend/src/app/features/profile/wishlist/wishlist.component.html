<div class="page">
  <h2>Wishlist</h2>

  <div class="card" *ngIf="isLoading">Loading wishlist...</div>

  <div class="card" *ngIf="!isLoading && errorMessage">
    <p class="error">{{ errorMessage }}</p>
  </div>

  <div class="card" *ngIf="!isLoading && !wishlist.length">
    <p>No wishlist items yet.</p>
  </div>

  <div class="wishlist-grid" *ngIf="!isLoading && wishlist.length">
    <div class="product-card" *ngFor="let item of wishlist">
      <!-- Image -->
      <div class="product-image-wrapper">
        <img *ngIf="item.primary_image" [src]="item.primary_image.image" [alt]="item.name" class="product-img" />
        <div class="no-image" *ngIf="!item.primary_image">
          <span>🛍️</span>
        </div>
      </div>

      <!-- Info -->
      <div class="product-info">
        <h3 class="product-name">
          <a [routerLink]="['/products', item.id]">{{ item.name }}</a>
        </h3>
        <div class="product-footer">
          <span class="product-price">${{ item.price }}</span>
          <button class="btn btn-outline text-danger btn-sm" (click)="onRemoveItem(item.id)">
            Remove
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
