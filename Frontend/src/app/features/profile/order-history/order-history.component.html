<div class="glass-body">
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <div class="orders-page">
    <h2>📦 My Orders</h2>

    <div class="glass-container" *ngIf="isLoading">
      <p style="color: rgba(255,255,255,0.7);">Loading orders...</p>
    </div>

    <div class="glass-container" *ngIf="!isLoading && errorMessage">
      <p class="error">❌ {{ errorMessage }}</p>
    </div>

    <div class="glass-container" *ngIf="!isLoading && !orders.length">
      <span style="font-size: 3rem; margin-bottom: 1rem; display: block;">🛍️</span>
      <p style="font-size: 1.1rem; color: rgba(255,255,255,0.7);">You haven't placed any orders yet.</p>
    </div>

    <div class="orders-grid" *ngIf="!isLoading && orders.length">
      <div class="glass-order-card" *ngFor="let order of orders">
        <!-- Header -->
        <div class="order-header">
          <span class="order-id">Order #{{ order.id }}</span>
          <span class="status-badge" [ngClass]="order.status.toLowerCase()">
            {{ order.status | titlecase }}
          </span>
        </div>

        <!-- Body -->
        <div class="order-body">
          <p><strong>Date:</strong> {{ order.created_at | date: "mediumDate" }}</p>
          <p><strong>Total:</strong> <span class="highlight">${{ order.total_price }}</span></p>
          <p><strong>Items:</strong> {{ order.items.length }} items</p>
        </div>

        <!-- Footer -->
        <div class="order-footer">
          <a [routerLink]="['/profile/orders', order.id]" class="glass-btn primary">
            View Details
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
