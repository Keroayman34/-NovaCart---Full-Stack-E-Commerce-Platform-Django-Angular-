<div class="recent-orders animated-element" style="animation-delay: 0.6s">
  <div class="section-header">
    <h2>Recent Orders</h2>
    <a href="/seller/orders" class="view-all">View All →</a>
  </div>

  <div class="table-container">
    <table class="orders-table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td class="order-id">#{{ order.id }}</td>
          <td>{{ order.customer }}</td>
          <td class="amount">{{ formatCurrency(order.amount) }}</td>
          <td>
            <span [ngClass]="getStatusBadgeClass(order.status)">
              {{ getStatusLabel(order.status) }}
            </span>
          </td>
          <td class="date">{{ order.date }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
