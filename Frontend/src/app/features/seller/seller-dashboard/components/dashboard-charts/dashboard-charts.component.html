<div class="charts-section">
  <div class="chart-container animated-element" style="animation-delay: 0.4s">
    <h2>Sales Overview (This Month)</h2>
    <div class="chart-placeholder">
      <svg viewBox="0 0 400 200" class="simple-chart">
        <defs>
          <linearGradient id="barGradient" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="rgba(99, 102, 241, 0.2)" />
            <stop offset="100%" stop-color="rgba(168, 85, 247, 1)" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Animated bar chart visualization -->
        <rect x="30" y="100" width="24" height="60" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-1" />
        <rect x="70" y="80" width="24" height="80" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-2" />
        <rect x="110" y="60" width="24" height="100" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-3" />
        <rect x="150" y="40" width="24" height="120" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-4" />
        <rect x="190" y="80" width="24" height="80" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-5" />
        <rect x="230" y="50" width="24" height="110" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-6" />
        <rect x="270" y="70" width="24" height="90" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-7" />
        <rect x="310" y="30" width="24" height="130" fill="url(#barGradient)" filter="url(#glow)" class="bar bar-8" />
        
        <!-- Axis -->
        <line x1="20" y1="160" x2="350" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
        <line x1="20" y1="20" x2="20" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
      </svg>
    </div>
    <p class="chart-note">Sales are trending up this month. Keep up the great work!</p>
  </div>

  <div class="chart-container animated-element" style="animation-delay: 0.5s">
    <h2>Order Status Distribution</h2>
    <div class="chart-placeholder">
      <svg viewBox="0 0 200 200" class="pie-chart">
        <defs>
          <filter id="pieGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Simplified pie chart with animated strokes -->
        <circle cx="100" cy="100" r="60" fill="none" stroke="#6366f1" stroke-width="25" stroke-dasharray="94.2 314" stroke-dashoffset="0" class="pie-segment segment-1" filter="url(#pieGlow)" />
        <circle cx="100" cy="100" r="60" fill="none" stroke="#8b5cf6" stroke-width="25" stroke-dasharray="47.1 314" stroke-dashoffset="-94.2" class="pie-segment segment-2" filter="url(#pieGlow)" />
        <circle cx="100" cy="100" r="60" fill="none" stroke="#f59e0b" stroke-width="25" stroke-dasharray="62.8 314" stroke-dashoffset="-141.3" class="pie-segment segment-3" filter="url(#pieGlow)" />
        <circle cx="100" cy="100" r="60" fill="none" stroke="#10b981" stroke-width="25" stroke-dasharray="109.9 314" stroke-dashoffset="-204.1" class="pie-segment segment-4" filter="url(#pieGlow)" />
        
        <circle cx="100" cy="100" r="45" fill="rgba(30, 30, 47, 0.9)" />
        <text x="100" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff" class="pie-center-text">
          4.8★
        </text>
      </svg>
    </div>
    <div class="legend">
      <span><span class="legend-color" style="background: #6366f1; box-shadow: 0 0 8px #6366f1"></span>Delivered</span>
      <span><span class="legend-color" style="background: #8b5cf6; box-shadow: 0 0 8px #8b5cf6"></span>Shipped</span>
      <span><span class="legend-color" style="background: #f59e0b; box-shadow: 0 0 8px #f59e0b"></span>Processing</span>
      <span><span class="legend-color" style="background: #10b981; box-shadow: 0 0 8px #10b981"></span>Pending</span>
    </div>
  </div>
</div>
