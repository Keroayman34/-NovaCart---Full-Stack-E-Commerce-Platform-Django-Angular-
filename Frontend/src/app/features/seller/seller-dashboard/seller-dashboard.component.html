<div class="seller-dashboard">
  <!-- Loading State -->
  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading dashboard...</p>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading && dashboardData" class="dashboard-content">
    <!-- Header -->
    <div class="dashboard-header animated-element">
      <h1>Dashboard</h1>
      <p class="subtitle">Welcome back! Here's your sales overview.</p>
    </div>

    <!-- Stats Cards -->
    <app-dashboard-stats [stats]="dashboardData.stats"></app-dashboard-stats>

    <!-- Charts Section -->
    <app-dashboard-charts></app-dashboard-charts>

    <!-- Recent Orders -->
    <app-dashboard-recent-orders [orders]="dashboardData.recentOrders"></app-dashboard-recent-orders>

    <!-- Top Products -->
    <app-dashboard-top-products [products]="dashboardData.topProducts"></app-dashboard-top-products>
  </div>
</div>
